[build]
  publish = "."
  command = "node scripts/release.js"

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "https://www.solucionesgea.com/*"
  to = "https://solucionesgea.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://soluciones-gea.netlify.app/*"
  to = "https://solucionesgea.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
