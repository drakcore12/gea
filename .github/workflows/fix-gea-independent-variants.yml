name: Fix independent GEA SVG variants

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-gea-independent-variants.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild self-contained SVG variants
        shell: python
        run: |
          from pathlib import Path

          folder = Path("assets/img")
          sources = {
              "isotipo": folder / "isotipo.svg",
              "imagotipo_horizontal": folder / "imagotipo-horizontal.svg",
          }
          original_colors = {
              "isotipo": ["#005BE7", "#57BB2D", "#FE8601"],
              "imagotipo_horizontal": ["#01194C", "#0156DD", "#3EB025", "#FD7501"],
          }
          variants = {
              "negro": "#000000",
              "blanco": "#FFFFFF",
              "gris": "#808080",
              "naranja": "#FD7501",
              "verde": "#3EB025",
              "azul": "#0156DD",
          }

          for kind, source in sources.items():
              svg = source.read_text(encoding="utf-8")
              for name, color in variants.items():
                  output = svg
                  for original in original_colors[kind]:
                      output = output.replace(original, color)

                  filename = (
                      f"Soluciones_GEA_isotipo_{name}.svg"
                      if kind == "isotipo"
                      else f"Soluciones_GEA_imagotipo_horizontal_{name}.svg"
                  )
                  (folder / filename).write_text(output, encoding="utf-8")

      - name: Commit corrected independent SVGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/Soluciones_GEA_*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make GEA SVG color variants fully independent"
            git push
          fi
