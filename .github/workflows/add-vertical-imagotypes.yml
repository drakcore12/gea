name: Add vertical GEA imagotypes

on:
  push:
    branches: [main]
    paths:
      - .gea-trigger-vertical

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create native standalone vertical SVG files
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import xml.etree.ElementTree as ET

          encoded = ""
          base = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          originals = ('#01194C', '#FD7501', '#3EB025', '#0156DD')
          outputs = {
              'Soluciones_GEA_imagotipo_vertical_ultra_preciso.svg': None,
              'Soluciones_GEA_imagotipo_vertical_negro.svg': '#000000',
              'Soluciones_GEA_imagotipo_vertical_blanco.svg': '#FFFFFF',
              'Soluciones_GEA_imagotipo_vertical_gris.svg': '#808080',
              'Soluciones_GEA_imagotipo_vertical_naranja.svg': '#FD7501',
              'Soluciones_GEA_imagotipo_vertical_verde.svg': '#3EB025',
              'Soluciones_GEA_imagotipo_vertical_azul.svg': '#0156DD',
          }

          assets = Path('assets/img')
          for filename, color in outputs.items():
              svg = base
              if color:
                  for original in originals:
                      svg = svg.replace(original, color)
              if '<image' in svg.lower() or 'href=' in svg.lower():
                  raise RuntimeError(f'{filename} contiene una referencia externa')
              ET.fromstring(svg)
              (assets / filename).write_text(svg, encoding='utf-8')
              print(f'Creado: assets/img/{filename}')

      - name: Commit vertical imagotypes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .gea-trigger-vertical .github/workflows/add-vertical-imagotypes.yml
          git add assets/img/Soluciones_GEA_imagotipo_vertical_*.svg
          git commit -m "Add native standalone vertical GEA imagotypes"
          git push
